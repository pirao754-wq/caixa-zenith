<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0a14;--card:#161220;--card2:#1e1829;--line:#2d2540;--text:#eef0f5;--mute:#8b93a5;--acc:#a855f7;--accd:#9333ea;--warn:#f59e0b;--bad:#ef4444;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--text);font-size:15px;-webkit-tap-highlight-color:transparent;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--acc)}
input[type=date]{color-scheme:dark}
b{font-weight:700}
.mute{color:var(--mute)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(13,10,20,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo-ic{width:42px;height:42px;border-radius:10px;flex:none;object-fit:cover;box-shadow:0 0 14px rgba(168,85,247,.45)}
.logo{font-weight:800;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.pill{font-size:12px;font-weight:700;padding:7px 11px;border-radius:99px;background:#3a1717;color:#fca5a5;white-space:nowrap}
.pill.on{background:#10301f;color:#86efac}
.icon-btn{width:40px;height:40px;flex:none;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:17px}
main{padding:16px;padding-bottom:150px;max-width:1320px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#110d19;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);font-weight:600;position:relative}
nav button .i{font-size:21px;line-height:1.1}
nav button.on{color:var(--acc)}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--warn);color:#000;font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px}
.banner{background:#2a2110;color:#fcd34d;border:1px solid #4a3a14;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
h2{font-size:20px;font-weight:800;margin-bottom:12px;letter-spacing:-.3px}
h3{font-size:18px;font-weight:800;margin-bottom:14px;padding-right:40px}
h4{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);margin:22px 0 10px;font-weight:700}
.btn{padding:11px 14px;border-radius:10px;font-weight:700;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.btn.primary{background:linear-gradient(135deg,#b05cf8,#8b2fe0);color:#fff;border-color:#a855f7}
.btn.primary:active{background:var(--accd)}
.btn.ghost{background:transparent}
.btn.danger{color:#fca5a5;border-color:#4a2020}
.btn.big{padding:15px;font-size:17px;width:100%}
.btn.sm{padding:8px 10px;font-size:13px}
.toolbar{display:flex;gap:10px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:8px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;color:var(--mute)}
.chip.on{background:#a855f7;color:#fff;border-color:#a855f7}
.empty{color:var(--mute);text-align:center;padding:28px 10px;font-size:14px}
/* PDV */
.pdv{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .08s}
.prod:active{transform:scale(.96);border-color:var(--acc);box-shadow:0 0 16px rgba(168,85,247,.35)}
.prod .n{font-weight:600;font-size:14px;line-height:1.25}
.prod .p{font-weight:800;color:#d8b4fe;font-size:16px}
.prod .s{font-size:11px;color:var(--mute)}
.prod .s.low{color:var(--warn);font-weight:700}
.prod .s.zero{color:var(--bad);font-weight:700}
.ticket{display:none;flex-direction:column;padding:0;overflow:hidden}
.t-top{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.t-top select{font-weight:700}
.t-sub{font-size:12px;color:var(--mute);padding:8px 14px 0}
.t-items{flex:1;overflow-y:auto;padding:6px 12px}
.ti{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.ti:last-child{border-bottom:0}
.ti-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ti-n b{font-size:14px;font-weight:600}
.ti-n span{font-size:12px;color:var(--mute)}
.qty{display:flex;align-items:center;background:var(--card2);border-radius:10px;border:1px solid var(--line)}
.qty button{width:36px;height:36px;font-size:19px;font-weight:700}
.qty span{min-width:22px;text-align:center;font-weight:700}
.t-foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--card)}
.t-total{display:flex;justify-content:space-between;align-items:baseline}
.t-total b{font-size:24px;font-weight:800}
.t-total span{color:var(--mute);font-size:13px}
.t-btns{display:flex;gap:8px}
.t-btns:empty{display:none}
.t-btns .btn{flex:1}
.tbar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:25;background:linear-gradient(135deg,#b05cf8,#8b2fe0);color:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tbar b{font-size:18px}
body.show-ticket .ticket{display:flex;position:fixed;inset:0;z-index:50;border-radius:0;border:0}
@media(min-width:900px){
  body{padding-left:86px}
  nav{top:0;bottom:0;right:auto;width:86px;flex-direction:column;padding-top:76px;border-top:0;border-right:1px solid var(--line)}
  nav button{flex:none;padding:13px 0}
  .pdv{grid-template-columns:1fr 380px}
  .ticket{display:flex;position:sticky;top:76px;max-height:calc(100vh - 92px)}
  .tbar,.only-m{display:none!important}
  main{padding:20px 24px 40px}
}
/* lists */
.list{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pinfo{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.pinfo b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo span{font-size:12px;color:var(--mute)}
.stk{text-align:center;min-width:54px;font-weight:800;font-size:17px}
.stk small{display:block;font-size:10px;color:var(--mute);font-weight:600}
.stk.low{color:var(--warn)}
.stk.zero{color:var(--bad)}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;margin-bottom:14px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 0 var(--line)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--mute);font-weight:600}
.kpi b{display:block;font-size:21px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.kpi small{font-size:11px;color:var(--mute)}
.kpi.hl{border-color:#4c2a78;background:#1c1030}
.kpi.hl b{color:#e9d5ff}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:14px}
.bar-row .track{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar-row .fill{height:100%;border-radius:99px;background:var(--acc)}
.bar-row b{font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-weight:700;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.ccard:active{border-color:var(--acc)}
.cnum{font-size:26px;font-weight:800;letter-spacing:-.5px}
.cnome{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnome.sem{color:var(--mute);font-weight:500;font-style:italic}
.ctot{font-size:18px;font-weight:800;color:#d8b4fe;margin-top:6px}
.cmeta{font-size:12px;color:var(--mute)}
.vrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;gap:12px;align-items:center}
.vrow.cancel{opacity:.45}
.vrow.cancel .vt{text-decoration:line-through}
.vmain{flex:1;min-width:0}
.vmain .t1{font-size:13px;color:var(--mute)}
.vmain .t2{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.vt{font-weight:800;font-size:16px;text-align:right}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:4px;background:var(--card2);border:1px solid var(--line)}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--mute);margin:12px 0 6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{position:relative;background:var(--card);border:1px solid var(--line);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet .x{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;background:var(--card2);font-size:15px}
.mbtns{display:flex;gap:10px;margin-top:18px}
.mbtns .btn{flex:1}
.formas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.forma{background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:12px 4px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.forma .fi{font-size:20px}
.forma.on{border-color:var(--acc);background:#24123a;color:#e9d5ff}
.pay-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:12px 14px;background:var(--card2);border-radius:12px}
.pay-total b{font-size:28px;font-weight:800}
.pay-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.pay-sum span{display:block;font-size:12px;color:var(--mute);font-weight:700;margin-bottom:6px}
.pay-sum b{font-size:17px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.quick:empty{display:none}
.pay-info{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.pay-info.troco{background:#0f2118;color:#86efac}
.pay-info.troco b{font-size:24px}
.pay-info.falta{background:#2a2110;color:#fcd34d}
.pay-info.ok{background:#0f2118;color:#86efac}
.pag{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--card2);border-radius:10px;margin-top:8px;font-weight:600}
.pag button{color:var(--mute);font-size:14px;padding:2px 6px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);z-index:80;background:#f3e8ff;color:#2e1065;padding:12px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.warn{background:#fef3c7;color:#3a2a00}
#toast.bad{background:#fee2e2;color:#450a0a}
.loading{padding:60px 20px;text-align:center;color:var(--mute)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.exp{margin-bottom:4px}
.exp-t{font-weight:800;margin-bottom:10px}
.exp-row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;margin-top:8px}
.exp-row label{font-weight:700;color:var(--mute);font-size:13px}
textarea{width:100%;min-height:200px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:13px/1.5 ui-monospace,monospace}
</style>
</head>

const sb=(window.supabase&&/^https?:\/\//.test(SUPABASE_URL))?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const GTK='zenith-garcom-token';
const snake=k=>k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase());
const camel=k=>k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
const toRow=o=>{const r={};for(const k in o)if(o[k]!==undefined)r[snake(k)]=o[k];return r};
const fromRow=r=>{const o={};for(const k in r)o[camel(k)]=r[k];return o};
const COLS={garcons:'id,nome,ativo,criado_em,removido_em'};
function rota(p){const s=p.split('/');if(s[0]==='caixas'&&s[2]==='vendas')return{t:'vendas',id:s[3],caixa:s[1]};return{t:s[0],id:s[1]}}
class ErroDB extends Error{constructor(e){super((e&&e.message)||'erro');const c=e&&e.code;
  this.code=(c==='42501'||/row-level|permission|sem_permissao/i.test(this.message))?'invalid_argument':(c==='28000'||/sessao_invalida/.test(this.message))?'sessao':'unavailable'}}
const chk=r=>{if(r.error)throw new ErroDB(r.error);return r.data};
const souGarcom=()=>!!st.sessao&&st.sessao.tipo==='garcom';
const tokenGarcom=()=>{try{return localStorage.getItem(GTK)}catch(e){return null}};
let gCache=null,gCacheT=0;
function gDados(force){const tok=tokenGarcom();if(!tok)return Promise.reject(new ErroDB({code:'28000',message:'sessao_invalida'}));
  if(!force&&gCache&&Date.now()-gCacheT<1500)return gCache;
  gCacheT=Date.now();gCache=sb.rpc('garcom_dados',{p_token:tok}).then(chk);gCache.catch(()=>{gCache=null});return gCache}
async function selTodos(t,eq){let out=[],de=0;for(;;){let qq=sb.from(t).select(COLS[t]||'*');if(eq)qq=qq.eq(eq[0],eq[1]);
  const d=chk(await qq.range(de,de+999));out=out.concat(d);if(d.length<1000)break;de+=1000}return out.map(fromRow)}
async function gSalvarComanda(id,c){chk(await sb.rpc('garcom_salvar_comanda',{p_token:tokenGarcom(),p_id:id,p_numero:Number(c.numero)||0,p_nome:c.nome||'',p_itens:c.itens||[]}));depoisDeGravar()}
const semPerm=()=>new ErroDB({code:'42501',message:'sem_permissao'});
const S={
  async set(p,d){const r=rota(p);
    if(souGarcom()){if(r.t!=='comandas')throw semPerm();return gSalvarComanda(r.id,d)}
    const row=toRow({...d,id:r.id});if(r.caixa)row.caixa_id=r.caixa;chk(await sb.from(r.t).upsert(row));depoisDeGravar()},
  async update(p,d){const r=rota(p);
    if(souGarcom()){if(r.t!=='comandas')throw semPerm();const c=st.comandas.find(x=>x.id===r.id)||{};return gSalvarComanda(r.id,{...c,...d})}
    chk(await sb.from(r.t).update(toRow(d)).eq('id',r.id));depoisDeGravar()},
  async del(p){const r=rota(p);
    if(souGarcom()){if(r.t!=='comandas')throw semPerm();chk(await sb.rpc('garcom_excluir_comanda',{p_token:tokenGarcom(),p_id:r.id}));return depoisDeGravar()}
    chk(await sb.from(r.t).delete().eq('id',r.id));depoisDeGravar()},
  async getCol(p){const r=rota(p);if(souGarcom())return[];return selTodos(r.t,r.caixa?['caixa_id',r.caixa]:null)},
  watchDoc(p,cb){const r=rota(p);return vigiar(async()=>{
    if(souGarcom()){const g=await gDados();return r.t==='config'?fromRow(g.config||{}):null}
    const d=chk(await sb.from(r.t).select(COLS[r.t]||'*').eq('id',r.id).maybeSingle());return d?fromRow(d):null},cb)},
  watchCol(p,cb){const r=rota(p);return vigiar(async()=>{
    if(souGarcom()){const g=await gDados();return(g[r.t]||[]).map(fromRow)}
    return selTodos(r.t,r.caixa?['caixa_id',r.caixa]:null)},cb)}
};
/* sincronização: o app pergunta ao banco só um número ("versão"); se mudou, recarrega os dados */
const VIG=new Set();let versaoVista=null;
function vigiar(fetch,cb){const s={fetch,cb,last:undefined,busy:false,again:false};VIG.add(s);atualizar(s);return()=>VIG.delete(s)}
async function atualizar(s){if(s.busy){s.again=true;return}s.busy=true;
  try{const d=await s.fetch();const j=JSON.stringify(d);if(VIG.has(s)&&j!==s.last){s.last=j;s.cb(d,{fromCache:false})}}
  catch(e){console.warn(e);if(e&&e.code==='sessao')sessaoInvalida();else if(!st.cfgLoaded){st.loadWarn=true;render()}}
  finally{s.busy=false;if(s.again){s.again=false;atualizar(s)}}}
function atualizarTudo(){gCache=null;VIG.forEach(atualizar)}
let gravT;function depoisDeGravar(){gCache=null;clearTimeout(gravT);gravT=setTimeout(atualizarTudo,60)}
setInterval(async()=>{if(!sb||!st.sessao||document.hidden)return;try{const v=chk(await sb.rpc('versao_atual'));if(v!==versaoVista){const primeira=versaoVista===null;versaoVista=v;if(!primeira)atualizarTudo()}}catch(e){}},3000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&st.sessao)atualizarTudo()});
function pararTudo(){VIG.clear();caixaUnsubs=[];caixaSubId=undefined;gCache=null;versaoVista=null}
function sessaoInvalida(){if(st.sessao){sair(true);toast('Sua sessão terminou ou o acesso foi removido. Entre de novo.','warn')}}
const Q={};function q(p,fn){const r=(Q[p]||Promise.resolve()).catch(()=>{}).then(fn);Q[p]=r;return r}
function dbErr(e){console.warn(e)}
async function W(fn){try{return await fn()}catch(e){console.error(e);const c=e&&e.code;
  if(c==='sessao'){sessaoInvalida();throw e}
  toast(c==='invalid_argument'?'Sem permissão para fazer isso.':'Não foi possível salvar. Verifique a internet e tente de novo.','bad');throw e}}

async function boot(){

async function sair(semServidor){const s=st.sessao;st.sessao=null;pararTudo();

const NM={},NMpend=new Set();

    if(st.cfg.caixaAberto!==caixaSubId)subCaixa(st.cfg.caixaAberto);
    render()});
  S.watchCol('garcons',ds=>{st.garcons=ds.sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));
    if(souGarcom()&&!garcomAtivo(st.sessao.id)){sessaoInvalida()}render()});
  S.watchCol('produtos',ds=>{st.produtos=ds.sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'));render()});
  S.watchCol('comandas',ds=>{st.comandas=ds.sort((a,b)=>(a.numero||0)-(b.numero||0));
    const id=st.ticket.comandaId;if(id&&id!==st.justCreated&&!ds.some(c=>c.id===id))st.ticket.comandaId=null;
    if(ds.some(c=>c.id===st.justCreated))st.justCreated=null;render()});
}
function subCaixa(id){caixaUnsubs.forEach(f=>f());caixaUnsubs=[];caixaSubId=id;st.caixa=null;st.vendas=[];if(!id||!isDono())return;
  caixaUnsubs.push(S.watchDoc('caixas/'+id,d=>{st.caixa=d?{id,...d}:null;render()}));
  caixaUnsubs.push(S.watchCol('caixas/'+id+'/vendas',ds=>{st.vendas=ds.sort((a,b)=>b.ts-a.ts);render()}));
}

/* ============ ticket / comandas ============ */
const ticketComanda=()=>st.ticket.comandaId?st.comandas.find(c=>c.id===st.ticket.comandaId)||null:null;
const comItens=c=>st.pend[c.id]||c.itens||[];
const ticketItens=()=>{const c=ticketComanda();return c?comItens(c):st.ticket.itens};
const subtotal=it=>it.reduce((s,i)=>s+i.preco*i.qtd,0);
const nItens=it=>it.reduce((s,i)=>s+i.qtd,0);
const pendT={};
function setItens(itens){const c=ticketComanda();if(!c){st.ticket.itens=itens;render();return}
  st.pend[c.id]=itens;render();clearTimeout(pendT[c.id]);pendT[c.id]=setTimeout(()=>flushComanda(c.id),350)}
async function flushComanda(id){clearTimeout(pendT[id]);const itens=st.pend[id];if(!itens)return;
  try{await q('comandas/'+id,()=>S.update('comandas/'+id,{itens}))}catch(e){toast('Não foi possível salvar a comanda.','bad')}
  if(st.pend[id]===itens)delete st.pend[id];render()}
function addProduto(pid){const p=st.produtos.find(x=>x.id===pid);if(!p)return;
  if(!isDono()&&!ticketComanda()){modalEscolherComanda(pid);return}
  const it=clone(ticketItens());const ex=it.find(i=>i.pid===pid);
  if(ex)ex.qtd++;else it.push({pid,nome:p.nome,preco:p.preco,qtd:1});
  const naCesta=(ex?ex.qtd:1);if((Number(p.estoque)||0)-naCesta<0)toast(`Atenção: estoque de ${p.nome} está zerado`,'warn');
  setItens(it)}
function proxNumero(){const u=new Set(st.comandas.map(c=>Number(c.numero)));let n=1;while(u.has(n))n++;return n}

/* ============ render ============ */
let rq=false;function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;draw()})}
const TABS=[['vender','Vender','🛒'],['comandas','Comandas','🧾'],['caixa','Caixa','💰'],['estoque','Estoque','📦'],['relatorios','Relatórios','📊']];
function draw(){
  $('#loja').textContent=st.cfg.nome||NOME_PADRAO;
  const ab=!!st.cfg.caixaAberto;const pill=$('#pill');pill.textContent=ab?(innerWidth<420?'● Aberto':'● Caixa aberto'):(innerWidth<420?'Fechado':'Caixa fechado');pill.classList.toggle('on',ab);
  const dono=isDono();pill.style.display=dono?'':'none';$('#gear').style.display=dono?'':'none';
  const ub=$('#userBtn');ub.style.display=st.sessao?'':'none';if(st.sessao)ub.textContent=dono?'👑 Sair':'🍺 '+(nomeDe(st.sessao.id)||'Garçom')+' · Sair';
  $('#nav').style.display=st.sessao?'':'none';
  const tabs=dono?TABS:[['vender','Lançar','🍺'],['comandas','Comandas','🧾']];
  if(st.role&&!tabs.some(t=>t[0]===st.tab))st.tab='comandas';
  const baixos=st.produtos.filter(p=>p.ativo!==false&&Number(p.minimo)>0&&(Number(p.estoque)||0)<=Number(p.minimo)).length;
  $('#nav').innerHTML=tabs.map(([k,l,i])=>`<button class="${st.tab===k?'on':''}" data-act="tab" data-id="${k}"><span class="i">${i}</span>${l}${k==='comandas'&&st.comandas.length?`<span class="badge">${st.comandas.length}</span>`:''}${k==='estoque'&&baixos?`<span class="badge">${baixos}</span>`:''}</button>`).join('');
  const ae=document.activeElement;const fid=ae&&ae.id&&ae.dataset&&ae.dataset.keep?ae.id:null;let sel=null;if(fid){try{sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}}
  let html='';
  if(!st.cfgLoaded||!st.role){html=`<div class="loading"><img src="${LOGO_SRC}" alt="" style="width:100%;max-width:280px;border-radius:12px;margin-bottom:16px"><div class="spin"></div>Carregando…</div>`}
  else{
    if(st.loadWarn)html+=`<div class="banner">Sem conexão com o servidor. Verifique a internet; o sistema continua tentando.</div>`;
    if(st.erroConfig)html+=`<div class="card empty">⚙️ Falta configurar o Supabase.<br>Abra o arquivo <b>index.html</b> e cole a <b>Project URL</b> e a <b>anon key</b> no topo.</div>`;
    else if(!st.sessao)html+=vLogin();
    else html+={vender:vVender,comandas:vComandas,caixa:vCaixa,estoque:vEstoque,relatorios:vRel}[st.tab]();
  }
  $('#app').innerHTML=html;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  document.body.classList.toggle('show-ticket',st.showTicket&&st.tab==='vender');
}

/* ---- Vender ---- */
function vVender(){
  const ativos=st.produtos.filter(p=>p.ativo!==false);
  const cats=['Todas',...[...new Set(ativos.map(p=>p.categoria||'Outros'))].sort((a,b)=>a.localeCompare(b,'pt-BR'))];
  if(!cats.includes(st.cat))st.cat='Todas';
  const b=norm(st.busca);
  const ps=ativos.filter(p=>(st.cat==='Todas'||(p.categoria||'Outros')===st.cat)&&(!b||norm(p.nome).includes(b)||norm(p.categoria).includes(b)));
  const grid=!ativos.length?`<div class="card empty">Nenhum produto cadastrado ainda.<br><br><button class="btn primary" data-act="novoProduto">+ Cadastrar produto</button></div>`
    :!ps.length?`<div class="empty">Nada encontrado.</div>`
    :`<div class="grid">${ps.map(p=>{const e=Number(p.estoque)||0,m=Number(p.minimo)||0;const cls=e<=0?'zero':(m>0&&e<=m?'low':'');
      return `<button class="prod" data-act="add" data-id="${esc(p.id)}"><div class="n">${esc(p.nome)}</div><div><div class="p">${fm(p.preco)}</div><div class="s ${cls}">${e<=0?'Sem estoque':'Estoque: '+e}</div></div></button>`}).join('')}</div>`;
  const c=ticketComanda();const it=ticketItens();const sub=subtotal(it);const n=nItens(it);
  const tbar=(it.length||c)?`<button class="tbar" data-act="showTicket"><span>${c?'Comanda '+esc(c.numero):'Balcão'} · ${n} ${n===1?'item':'itens'}</span><span><b>${fm(sub)}</b> ›</span></button>`:'';
  return `<div class="pdv"><section>
    <div class="toolbar"><input id="busca" data-keep="1" data-bind="busca" value="${esc(st.busca)}" placeholder="🔍 Buscar produto…" autocomplete="off"></div>
    <div class="chips">${cats.map(k=>`<button class="chip ${st.cat===k?'on':''}" data-act="cat" data-v="${esc(k)}">${esc(k)}</button>`).join('')}</div>

}

/* ---- Caixa ---- */
function resumoCaixa(){const cx=st.caixa||{};const vs=st.vendas.filter(v=>!v.cancelada);
  const f={dinheiro:0,pix:0,debito:0,credito:0};let total=0;vs.forEach(v=>{total+=v.total;(v.pagamentos||[]).forEach(p=>f[p.forma]=(f[p.forma]||0)+p.valor)});
  const movs=cx.movs||[];const sang=movs.filter(m=>m.tipo==='sangria').reduce((s,m)=>s+m.valor,0);const sup=movs.filter(m=>m.tipo==='suprimento').reduce((s,m)=>s+m.valor,0);
  return{n:vs.length,total,f,fundo:cx.fundo||0,sang,sup,esperado:(cx.fundo||0)+f.dinheiro+sup-sang}}

  }
  const cx=st.caixa;const r=resumoCaixa();

  <h4>Resumo</h4>
  <div class="kpis"><div class="kpi hl"><span>Total vendido</span><b>${fm(r.total)}</b></div><div class="kpi"><span>Vendas</span><b>${r.n}</b><small>ticket médio ${fm(r.n?r.total/r.n:0)}</small></div>
  <div class="kpi"><span>Dinheiro na gaveta</span><b>${fm(r.esperado)}</b><small>fundo ${fm(r.fundo)}${r.sang?' · sangria −'+fm(r.sang):''}${r.sup?' · supr. +'+fm(r.sup):''}</small></div>
  <div class="kpi"><span>Comandas abertas</span><b>${st.comandas.length}</b><small>${fm(st.comandas.reduce((s,c)=>s+subtotal(comItens(c)),0))} a receber</small></div></div>
  <h4>Por forma de pagamento</h4>
  <div class="card">${barsFormas(r.f)}</div>
  ${(cx&&cx.movs&&cx.movs.length)?`<h4>Sangrias e suprimentos</h4><div class="list">${cx.movs.map(m=>`<div class="vrow"><div class="vmain"><div class="t1">${hm(m.ts)} · ${m.tipo==='sangria'?'Sangria (retirada)':'Suprimento (entrada)'}</div><div class="t2">${esc(m.motivo||'—')}</div></div><div class="vt" style="color:${m.tipo==='sangria'?'#fca5a5':'#86efac'}">${m.tipo==='sangria'?'−':'+'}${fm(m.valor)}</div></div>`).join('')}</div>`:''}

function barsFormas(f){const tot=Object.values(f).reduce((a,b)=>a+b,0)||1;

async function loadHist(){st.hist=st.hist||[];try{const cs=await S.getCol('caixas');st.hist=cs.filter(c=>c.status==='fechado').sort((a,b)=>b.abertoEm-a.abertoEm).slice(0,10)}catch(e){st.hist=[]}render()}

/* ---- Estoque ---- */
function vEstoque(){
  const seg=`<div class="seg"><button class="${st.estView==='produtos'?'on':''}" data-act="estView" data-v="produtos">Produtos</button><button class="${st.estView==='compras'?'on':''}" data-act="estView" data-v="compras">Lista de compras</button></div>`;
  if(st.estView==='compras')return seg+vCompras();
  const b=norm(st.estBusca);const low=p=>Number(p.minimo)>0&&(Number(p.estoque)||0)<=Number(p.minimo);
  let ps=st.produtos.filter(p=>(!b||norm(p.nome).includes(b)||norm(p.categoria).includes(b))&&(!st.estLow||low(p)));
  ps=ps.slice().sort((a,c)=>(low(c)-low(a))||String(a.nome).localeCompare(String(c.nome),'pt-BR'));
  const nLow=st.produtos.filter(low).length;
  const valor=st.produtos.reduce((s,p)=>s+(Number(p.custo)||0)*Math.max(0,Number(p.estoque)||0),0);
  return seg+`<div class="toolbar"><input id="estBusca" data-keep="1" data-bind="estBusca" value="${esc(st.estBusca)}" placeholder="🔍 Buscar produto" autocomplete="off"><button class="btn primary" data-act="novoProduto">+ Produto</button></div>
  <div class="chips"><button class="chip ${!st.estLow?'on':''}" data-act="estLow" data-v="0">Todos (${st.produtos.length})</button><button class="chip ${st.estLow?'on':''}" data-act="estLow" data-v="1">⚠ Estoque baixo (${nLow})</button></div>
  ${valor?`<p class="mute" style="font-size:13px;margin-bottom:10px">Valor em estoque (pelo custo): <b style="color:var(--text)">${fm(valor)}</b></p>`:''}
  ${ps.length?`<div class="list">${ps.map(p=>{const e=Number(p.estoque)||0;const cls=e<=0?'zero':(low(p)?'low':'');return `<div class="prow"><button class="pinfo" data-act="editProduto" data-id="${esc(p.id)}"><b>${esc(p.nome)}</b><span>${esc(p.categoria||'Outros')} · ${fm(p.preco)}${p.custo?' · custo '+fm(p.custo):''}</span></button><div class="stk ${cls}">${e}<small>mín ${Number(p.minimo)||0}</small></div><button class="btn sm" data-act="entrada" data-id="${esc(p.id)}">+ Entrada</button></div>`}).join('')}</div>`
  :`<div class="card empty">${st.produtos.length?'Nenhum produto encontrado.':'Cadastre os produtos da loja para controlar o estoque.'}</div>`}`;
}
function comprasRows(){const v7=st.compras.vend||{};
  return st.produtos.filter(p=>p.ativo!==false).map(p=>{const v=v7[p.id]||0,e=Number(p.estoque)||0,m=Number(p.minimo)||0;const baixo=m>0&&e<=m;let sug=Math.max(0,Math.ceil(v+m-e));if(baixo&&!sug)sug=Math.max(1,m-e+1);return{p,v,e,m,sug,baixo}})
    .filter(r=>r.baixo||r.sug>0).sort((a,b)=>(b.baixo-a.baixo)||(b.sug-a.sug))}
function vCompras(){

  :`<div class="card empty">Tudo em dia! Nenhum produto precisa de reposição agora.<br><span style="font-size:12px">Dica: defina o estoque mínimo de cada produto para receber alertas.</span></div>`}`;

async function loadCompras(){st.compras.carregando=true;render();try{const[i,f]=periodo('7d');const vs=await loadVendas(i,f);const m={};vs.forEach(v=>(v.itens||[]).forEach(it=>{if(it.pid)m[it.pid]=(m[it.pid]||0)+it.qtd}));st.compras.vend=m}catch(e){st.compras.vend={};toast('Não foi possível carregar as vendas','bad')}st.compras.carregando=false;render()}

/* ---- Relatórios ---- */
function periodo(k){const now=Date.now();const sod=x=>{const d=new Date(x);d.setHours(0,0,0,0);return d.getTime()};const d=new Date();
  if(k==='hoje')return[sod(now),now];
  if(k==='ontem'){const y=new Date(sod(now));y.setDate(y.getDate()-1);return[y.getTime(),sod(now)-1]}
  if(k==='7d'){const y=new Date(sod(now));y.setDate(y.getDate()-6);return[y.getTime(),now]}
  if(k==='mes')return[new Date(d.getFullYear(),d.getMonth(),1).getTime(),now];
  if(k==='mesant')return[new Date(d.getFullYear(),d.getMonth()-1,1).getTime(),new Date(d.getFullYear(),d.getMonth(),1).getTime()-1];
  if(k==='custom'){const p=s=>{const[a,b,c]=String(s).split('-').map(Number);return a?new Date(a,b-1,c):null};const i=p(st.rel.ini),f=p(st.rel.fim);if(!i||!f)return[null,null];f.setHours(23,59,59,999);return[i.getTime(),f.getTime()]}
  return[null,null]}
async function loadVendas(ini,fim){const cx=await S.getCol('caixas');const rel=cx.filter(c=>c.abertoEm<=fim&&(c.fechadoEm||Date.now())>=ini);
  const parts=await Promise.all(rel.map(c=>S.getCol('caixas/'+c.id+'/vendas')));const out=[];
  parts.flat().forEach(v=>{if(!v.cancelada&&v.ts>=ini&&v.ts<=fim)out.push(v)});return out}
async function loadRel(){const[i,f]=periodo(st.rel.periodo);if(i==null){toast('Escolha as duas datas','warn');return}
  st.rel.carregando=true;render();try{st.rel.dados={i,f,vs:await loadVendas(i,f)}}catch(e){toast('Erro ao carregar o relatório','bad')}st.rel.carregando=false;render()}
function agg(vs){const r={n:vs.length,total:0,custo:0,semCusto:false,f:{dinheiro:0,pix:0,debito:0,credito:0},prods:{},dias:{},horas:Array(24).fill(0)};
  vs.forEach(v=>{r.total+=v.total;(v.pagamentos||[]).forEach(p=>r.f[p.forma]=(r.f[p.forma]||0)+p.valor);
    const dk=dayKey(v.ts);(r.dias[dk]=r.dias[dk]||{n:0,t:0,ts:v.ts});r.dias[dk].n++;r.dias[dk].t+=v.total;r.horas[new Date(v.ts).getHours()]+=v.total;
    (v.itens||[]).forEach(i=>{const k=i.pid||i.nome;const P=r.prods[k]=r.prods[k]||{nome:i.nome,q:0,t:0};P.q+=i.qtd;P.t+=i.preco*i.qtd;r.custo+=(i.custo||0)*i.qtd;if(!i.custo)r.semCusto=true})});
  r.lucro=r.total-r.custo;return r}
function porGarcom(vs){const m={};vs.forEach(v=>{const k=v.garcom||'';(m[k]=m[k]||{id:v.garcom||null,n:0,t:0});m[k].n++;m[k].t+=v.total});return Object.values(m).sort((a,b)=>b.t-a.t)}
function vRel(){
  const P=[['hoje','Hoje'],['ontem','Ontem'],['7d','7 dias'],['mes','Este mês'],['mesant','Mês passado'],['custom','Escolher datas']];
  const anoAt=new Date().getFullYear();const anos=[];for(let y=anoAt;y>=Math.min(2026,anoAt);y--)anos.push(y);
  let h=`<div class="card exp"><div class="exp-t">📥 Relatórios para o contador <span class="mute">(Excel)</span></div>
    <div class="exp-row"><label>Mensal</label><input type="month" data-bind="expMes" value="${esc(st.expMes)}"><button class="btn primary sm" data-act="expMensal" ${st.exportando?'disabled':''}>Baixar</button></div>
    <div class="exp-row"><label>Anual</label><select data-bind="expAno">${anos.map(y=>`<option ${String(y)===String(st.expAno)?'selected':''}>${y}</option>`).join('')}</select><button class="btn primary sm" data-act="expAnual" ${st.exportando?'disabled':''}>Baixar</button></div>

  <h4 style="margin-top:18px">Ver na tela</h4>`;
  h+=`<div class="chips">${P.map(([k,l])=>`<button class="chip ${st.rel.periodo===k?'on':''}" data-act="periodo" data-v="${k}">${l}</button>`).join('')}</div>`;
  if(st.rel.periodo==='custom')h+=`<div class="toolbar"><input type="date" data-bind="relIni" value="${esc(st.rel.ini)}"><input type="date" data-bind="relFim" value="${esc(st.rel.fim)}"><button class="btn primary" data-act="aplicarCustom">Ver</button></div>`;
  if(!st.rel.dados&&!st.rel.carregando&&st.rel.periodo!=='custom')loadRel();

  const D=st.rel.dados;if(!D)return h+`<div class="card empty">Escolha o período.</div>`;

  h+=`<p class="mute" style="font-size:13px;margin-bottom:10px">${new Date(D.i).toLocaleDateString('pt-BR')} até ${new Date(Math.min(D.f,Date.now())).toLocaleDateString('pt-BR')}</p>`;

  h+=`<div style="margin:-2px 0 12px"><button class="btn sm" data-act="expPeriodo" ${st.exportando?'disabled':''}>📥 Baixar este período em Excel</button></div>`;
  h+=`<div class="kpis"><div class="kpi hl"><span>Faturamento</span><b>${fm(r.total)}</b>${nd>1?`<small>média ${fm(r.total/nd)}/dia</small>`:''}</div><div class="kpi"><span>Vendas</span><b>${r.n}</b>${nd>1?`<small>${(r.n/nd).toFixed(1).replace('.',',')}/dia</small>`:''}</div><div class="kpi"><span>Ticket médio</span><b>${fm(r.total/r.n)}</b></div><div class="kpi"><span>Lucro estimado</span><b>${fm(r.lucro)}</b><small>${r.semCusto?'* há produtos sem custo':'venda − custo'}</small></div></div>
  <h4>Formas de pagamento</h4><div class="card">${barsFormas(r.f)}</div>`;
  const pg=porGarcom(D.vs);if(pg.some(g=>g.id)){h+=`<h4>Por garçom</h4><div class="card tablewrap"><table><thead><tr><th>Garçom</th><th class="r">Comandas</th><th class="r">Total</th></tr></thead><tbody>${pg.map(g=>`<tr><td>${g.id?esc(nomeDe(g.id)||'…'):'Balcão / caixa'}</td><td class="r">${g.n}</td><td class="r"><b>${fm(g.t)}</b></td></tr>`).join('')}</tbody></table></div>`}

  const dias=Object.entries(r.dias).sort();
  if(dias.length>1){const mx=Math.max(...dias.map(d=>d[1].t));h+=`<h4>Por dia</h4><div class="card"><div class="bars">${dias.map(([k,d])=>`<div class="bar-row"><span>${new Date(d.ts).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})}</span><div class="track"><div class="fill" style="width:${d.t/mx*100}%"></div></div><b>${fm(d.t)}</b></div>`).join('')}</div></div>`}
  const hs=r.horas.map((t,i)=>[i,t]).filter(x=>x[1]>0);
  if(hs.length>1){const mx=Math.max(...hs.map(x=>x[1]));h+=`<h4>Horários de movimento</h4><div class="card"><div class="bars">${hs.map(([i,t])=>`<div class="bar-row"><span>${String(i).padStart(2,'0')}h – ${String((i+1)%24).padStart(2,'0')}h</span><div class="track"><div class="fill" style="width:${t/mx*100}%;background:#22d3ee"></div></div><b>${fm(t)}</b></div>`).join('')}</div></div>`}
  return h;
}

  const styles=`${H}<styleSheet xmlns="${NS}/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;R$&quot; #,##0.00"/></numFmts><fonts count="3"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="14"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE2EFDA"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="6"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  function build(sheets){const files=[];const add=(n,s)=>files.push({name:n,data:enc.encode(s)});

    const tabela=(nomeAba,cab1,grupos,extra)=>{const tot=linhaGrupo('',ok);

        ...grupos.map(g=>[g.rot,...(extra?[g.extra]:[]),g.n,...FK.map(k=>XM(g.f[k])),XM(g.d),XMB(g.t)]),
        [XB('TOTAL'),...(extra?['']:[]),XB(tot.n),...FK.map(k=>XMB(tot.f[k])),XMB(tot.d),XMB(tot.t)]]})};
    if(tipo==='anual'){const y=new Date(ini).getFullYear();tabela('Por mês','Mês',Array.from({length:12},(_,m)=>linhaGrupo(mesNome(y,m)+'/'+y,ok.filter(v=>new Date(v.ts).getMonth()===m))))}

    sheets.push({name:'Caixas',freeze:1,cols:[18,18,14,9,15,13,13,16,16,13],rows:[[XH('Abertura'),XH('Fechamento'),XH('Fundo de troco'),XH('Vendas'),XH('Total vendido'),XH('Sangrias'),XH('Suprimentos'),XH('Dinheiro esperado'),XH('Dinheiro contado'),XH('Diferença')],
      ...caixas.map(c=>{const ms=c.movs||[];const r=c.resumo;return[df(c.abertoEm)+' '+hm(c.abertoEm),c.fechadoEm?df(c.fechadoEm)+' '+hm(c.fechadoEm):'Ainda aberto',XM(c.fundo),r?r.n:'',r?XM(r.total):'',XM(ms.filter(m=>m.tipo==='sangria').reduce((s,m)=>s+m.valor,0)),XM(ms.filter(m=>m.tipo==='suprimento').reduce((s,m)=>s+m.valor,0)),c.esperado!=null?XM(c.esperado):'',c.contado!=null?XM(c.contado):'',(c.contado!=null&&c.esperado!=null)?XM(c.contado-c.esperado):'']})]});
    if(movs.length)sheets.push({name:'Sangrias e suprimentos',freeze:1,cols:[12,7,14,40,13],rows:[[XH('Data'),XH('Hora'),XH('Tipo'),XH('Motivo'),XH('Valor')],...movs.sort((a,b)=>a.ts-b.ts).map(m=>[df(m.ts),hm(m.ts),m.tipo==='sangria'?'Sangria':'Suprimento',m.motivo||'',XM(m.valor)])]});
    const pgs=porGarcom(ok);if(pgs.some(g=>g.id)){let ps={};if(U){try{ps=await U.profiles(pgs.filter(g=>g.id).map(g=>g.id))}catch(e){}}
      sheets.push({name:'Por garçom',freeze:1,cols:[30,12,16],rows:[[XH('Garçom'),XH('Comandas'),XH('Total vendido')],...pgs.map(g=>[g.id?((st.garcons.find(x=>x.id===g.id)||{}).nome||(g.id==='dono'?'Dono':'')||(ps[g.id]&&ps[g.id].name)||(g.id==='local'?'Você':'Garçom')):'Balcão / caixa',g.n,XM(g.t)])]})}
    const ep=st.produtos.filter(p=>p.ativo!==false);
    sheets.push({name:'Estoque atual',freeze:2,cols:[34,16,11,14,16],rows:[[XB(`Posição do estoque em ${new Date().toLocaleString('pt-BR')}`)],[XH('Produto'),XH('Categoria'),XH('Quantidade'),XH('Custo unitário'),XH('Valor em estoque')],
      ...ep.map(p=>{const e=Number(p.estoque)||0;return[p.nome,p.categoria||'Outros',e,XM(p.custo),XM((Number(p.custo)||0)*Math.max(0,e))]}),[XB('TOTAL'),'',XB(ep.reduce((s,p)=>s+Math.max(0,Number(p.estoque)||0),0)),'',XMB(ep.reduce((s,p)=>s+(Number(p.custo)||0)*Math.max(0,Number(p.estoque)||0),0))]]});
    await baixar(arquivo,XL.build(sheets));
  }catch(e){console.error(e);toast('Erro ao gerar o relatório','bad')}finally{st.exportando=false;render()}}

/* ---- pagamento ---- */
function payCalc(){const p=st.pay;const total=Math.max(0,p.sub-p.desc);const pago=p.pags.reduce((s,x)=>s+x.valor,0);return{total,pago,rest:Math.max(0,total-pago)}}
function modalPagar(){const c=ticketComanda();const it=clone(ticketItens());const sub=subtotal(it);
  st.pay={it,sub,desc:0,pags:[],troco:0,forma:'dinheiro',comandaId:c?c.id:null,garcom:c?(c.abertaPor||null):null,origem:c?`Comanda ${c.numero}${c.nome?' · '+c.nome:''}`:'Balcão'};
  openModal(`<h3>Cobrar · ${esc(st.pay.origem)}</h3>
  <div class="pay-sum"><div><span>Subtotal (${nItens(it)} itens)</span><b>${fm(sub)}</b></div><div><span>Desconto (R$)</span><input id="pDesc" inputmode="decimal" placeholder="0,00"></div></div>
  <div class="pay-total"><span>Total a pagar</span><b id="pTot"></b></div>
  <div class="formas">${Object.keys(FORMAS).map(k=>`<button class="forma" data-f="${k}"><span class="fi">${FICON[k]}</span>${FORMAS[k]}</button>`).join('')}</div>
  <label class="lbl" id="pLbl"></label><input id="pVal" inputmode="decimal">
  <p class="hint" id="pHint">💡 Mais de uma forma? Digite só a parte desta forma (ex.: R$ 20 no dinheiro) e toque em Adicionar. Depois escolha a outra forma para o restante.</p>
  <div class="quick" id="pQuick"></div>
  <div id="pList"></div>
  <div id="pInfo" class="pay-info"></div>
  <div class="mbtns"><button class="btn primary big" id="pFim">Finalizar venda</button></div>`,s=>{
    s.querySelectorAll('.forma').forEach(b=>b.onclick=()=>{st.pay.forma=b.dataset.f;$('#pVal').value='';updPay()});
    $('#pDesc').oninput=()=>{st.pay.desc=Math.min(pm($('#pDesc').value),sub);updPay()};
    $('#pVal').oninput=updPay;
    $('#pQuick').onclick=e=>{const b=e.target.closest('[data-v]');if(b){$('#pVal').value=fmv(+b.dataset.v);updPay()}};
    $('#pList').onclick=e=>{const b=e.target.closest('[data-i]');if(b){const x=st.pay.pags.splice(+b.dataset.i,1)[0];if(x&&x.forma==='dinheiro')st.pay.troco=0;updPay()}};
    $('#pFim').onclick=()=>{const{rest}=payCalc();const v=pm($('#pVal').value);addPag(!(rest>0&&v&&v<rest))};
    updPay()})}
function updPay(){const p=st.pay;if(!p)return;const{total,rest}=payCalc();
  $('#pTot').textContent=fm(total);
  document.querySelectorAll('.forma').forEach(b=>b.classList.toggle('on',b.dataset.f===p.forma));
  const din=p.forma==='dinheiro';
  $('#pLbl').textContent=rest>0?(din?'Valor recebido em dinheiro (para calcular o troco)':`Valor no ${FORMAS[p.forma]} (deixe vazio para o total)`):'';
  $('#pVal').style.display=rest>0?'':'none';$('#pVal').placeholder=fmv(rest)||'0,00';
  const v=pm($('#pVal').value);
  $('#pQuick').innerHTML=(din&&rest>0)?[rest,...[200,500,1000,2000,5000,10000,20000].filter(x=>x>rest).slice(0,3)].map((x,i)=>`<button class="btn sm" data-v="${x}">${i===0?'Exato':fm(x)}</button>`).join(''):'';
  $('#pList').innerHTML=(p.pags.length?'<label class="lbl">Pagamentos lançados</label>':'')+p.pags.map((x,i)=>`<div class="pag"><span>${FICON[x.forma]} ${FORMAS[x.forma]}</span><span>${fm(x.valor)} <button data-i="${i}">✕</button></span></div>`).join('');
  const inf=$('#pInfo');
  if(rest===0){inf.className='pay-info ok';inf.innerHTML=`<span>Pago ✓</span>${p.troco?`<span>Troco <b style="font-size:22px">${fm(p.troco)}</b></span>`:''}`}
  else if(din&&v>rest){inf.className='pay-info troco';inf.innerHTML=`<span>Troco</span><b>${fm(v-rest+p.troco)}</b>`}
  else if(v&&v<rest){inf.className='pay-info falta';inf.innerHTML=`<span>Vai faltar</span><b>${fm(rest-v)}</b>`}
  else if(p.pags.length){inf.className='pay-info falta';inf.innerHTML=`<span>Falta pagar</span><b>${fm(rest)}</b>`}
  else{inf.className='pay-info';inf.innerHTML=''}
  $('#pHint').style.display=rest>0?'':'none';
  $('#pFim').textContent=(rest>0&&v&&v<rest)?`Adicionar ${fm(v)} no ${FORMAS[p.forma]}`:(rest>0&&p.pags.length?`Finalizar (${fm(rest)} no ${FORMAS[p.forma]})`:'Finalizar venda');
}
function addPag(fin){const p=st.pay;if(!p)return;const{rest}=payCalc();
  if(rest>0){const v=pm($('#pVal').value)||rest;const apl=Math.min(v,rest);if(p.forma==='dinheiro'&&v>rest)p.troco+=v-rest;
    const ex=p.pags.find(x=>x.forma===p.forma);if(ex)ex.valor+=apl;else p.pags.push({forma:p.forma,valor:apl});$('#pVal').value=''}
  const r2=payCalc().rest;
  if(fin&&r2===0)finalizarVenda();else{if(r2>0)toast('Pagamento lançado. Falta '+fm(r2)+': escolha a forma do restante.','warn');
    if(r2>0&&p.pags.some(x=>x.forma===p.forma)){const o=Object.keys(FORMAS).find(k=>!p.pags.some(x=>x.forma===k));if(o)p.forma=o}updPay()}}
let finalizando=false;
async function finalizarVenda(){if(finalizando)return;const p=st.pay;const cxId=st.cfg.caixaAberto;if(!p||!cxId)return;finalizando=true;$('#pFim').disabled=true;

    const itens=p.it.map(i=>{const pr=st.produtos.find(x=>x.id===i.pid);return{pid:i.pid,nome:i.nome,preco:i.preco,custo:pr?(Number(pr.custo)||0):0,qtd:i.qtd}});
    await W(()=>S.set(`caixas/${cxId}/vendas/${uid()}`,{ts:Date.now(),itens,subtotal:p.sub,desconto:p.desc,total,pagamentos:p.pags,troco:p.troco,origem:p.origem,garcom:p.garcom||null,cancelada:false}));
    const troco=p.troco;
    if(p.comandaId){delete st.pend[p.comandaId];clearTimeout(pendT[p.comandaId]);st.ticket.comandaId=null;S.del('comandas/'+p.comandaId).catch(()=>toast('Venda salva, mas não consegui fechar a comanda.','warn'))}else st.ticket.itens=[];
    closeModal();st.showTicket=false;render();
    toast(`Venda registrada · ${fm(total)}${troco?' · Troco '+fm(troco):''}`);
    await baixaEstoque(itens,-1);st.compras.vend=null;
  }catch(e){const b=$('#pFim');if(b)b.disabled=false}finally{finalizando=false}}
async function baixaEstoque(itens,sinal){const lista=itens.filter(i=>i.pid).map(i=>({pid:i.pid,qtd:i.qtd}));if(!lista.length)return;
  try{chk(await sb.rpc('baixar_estoque',{p_itens:lista,p_sinal:sinal}));depoisDeGravar()}catch(e){console.warn(e);toast('A venda foi salva, mas o estoque não foi atualizado.','warn')}}

/* ---- comandas ---- */
function modalNovaComanda(itensIniciais){openModal(`<h3>Nova comanda</h3><div class="g2"><div><label class="lbl">Número</label><input id="cNum" inputmode="numeric" value="${proxNumero()}"></div><div><label class="lbl">Nome (opcional)</label><input id="cNome" placeholder="Ex.: João" autofocus></div></div><p class="hint">Pode deixar só o número e colocar o nome depois.</p><div class="mbtns"><button class="btn primary" id="cOk">Abrir comanda</button></div>`,()=>{
  $('#cOk').onclick=async()=>{const numero=parseInt($('#cNum').value,10)||proxNumero();if(st.comandas.some(c=>Number(c.numero)===numero)){toast('Já tem uma comanda aberta com o número '+numero,'warn');return}
    const id=uid();$('#cOk').disabled=true;try{st.justCreated=id;await W(()=>S.set('comandas/'+id,{numero,nome:$('#cNome').value.trim(),itens:itensIniciais||[],abertaEm:Date.now(),abertaPor:st.sessao?st.sessao.id:null}));
    if(itensIniciais)st.ticket.itens=[];st.ticket.comandaId=id;st.tab='vender';closeModal();render();toast('Comanda '+numero+' aberta')}catch(e){$('#cOk').disabled=false;st.justCreated=null}}})}
function modalEditComanda(id){const c=st.comandas.find(x=>x.id===id);if(!c)return;
  openModal(`<h3>Comanda #${esc(c.numero)}</h3><div class="g2"><div><label class="lbl">Número</label><input id="eNum" inputmode="numeric" value="${esc(c.numero)}"></div><div><label class="lbl">Nome</label><input id="eNome" value="${esc(c.nome||'')}" placeholder="Nome do cliente" autofocus></div></div><div class="mbtns"><button class="btn ghost danger" id="eDel">Excluir</button><button class="btn primary" id="eOk">Salvar</button></div>`,()=>{
  $('#eOk').onclick=async()=>{const numero=parseInt($('#eNum').value,10)||c.numero;if(st.comandas.some(x=>x.id!==id&&Number(x.numero)===numero)){toast('Esse número já está em uso','warn');return}
    try{await W(()=>q('comandas/'+id,()=>S.update('comandas/'+id,{numero,nome:$('#eNome').value.trim()})));closeModal()}catch(e){}};
  if(!isDono()&&comItens(c).length)$('#eDel').style.display='none';
  $('#eDel').onclick=()=>{const it=comItens(c);excluirComanda(id,it.length?`A comanda tem ${nItens(it)} itens (${fm(subtotal(it))}). Excluir mesmo assim? Nada será cobrado.`:null)}})}
function excluirComanda(id,msg){confirmar('Excluir comanda?',msg||'A comanda será removida.','Excluir',async()=>{await W(()=>S.del('comandas/'+id));delete st.pend[id];if(st.ticket.comandaId===id)st.ticket.comandaId=null;render()})}
function modalEnviar(){const it=st.ticket.itens;openModal(`<h3>Colocar em qual comanda?</h3><div class="list">${st.comandas.map(c=>`<button class="prow" data-env="${esc(c.id)}"><span class="pinfo"><b>#${esc(c.numero)} ${c.nome?'· '+esc(c.nome):''}</b><span>${fm(subtotal(comItens(c)))} até agora</span></span>›</button>`).join('')||'<p class="mute">Nenhuma comanda aberta.</p>'}</div><div class="mbtns"><button class="btn primary" id="envNova">+ Nova comanda com esses itens</button></div>`,s=>{
  $('#envNova').onclick=()=>modalNovaComanda(clone(it));
  s.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>{const c=st.comandas.find(x=>x.id===b.dataset.env);if(!c)return;const m=clone(comItens(c));
    it.forEach(i=>{const e=m.find(x=>x.pid===i.pid&&x.preco===i.preco);if(e)e.qtd+=i.qtd;else m.push(clone(i))});
    st.ticket.itens=[];st.ticket.comandaId=c.id;st.pend[c.id]=m;flushComanda(c.id);closeModal();render();toast('Itens lançados na comanda '+c.numero)})})}

/* ---- produtos ---- */
function modalProduto(id){const p=id?st.produtos.find(x=>x.id===id):{};if(!p)return;const cats=[...new Set(st.produtos.map(x=>x.categoria).filter(Boolean))];
  openModal(`<h3>${id?'Editar produto':'Novo produto'}</h3>
  <label class="lbl">Nome *</label><input id="fNome" value="${esc(p.nome||'')}" ${id?'':'autofocus'} placeholder="Ex.: Coca-Cola lata 350ml">
  <label class="lbl">Categoria</label><input id="fCat" list="dlCat" value="${esc(p.categoria||'')}" placeholder="Ex.: Bebidas"><datalist id="dlCat">${cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
  <div class="g2"><div><label class="lbl">Preço de venda *</label><input id="fPreco" inputmode="decimal" value="${fmv(p.preco)}" placeholder="0,00"></div><div><label class="lbl">Custo (compra)</label><input id="fCusto" inputmode="decimal" value="${fmv(p.custo)}" placeholder="0,00"></div></div>
  <div class="g2"><div><label class="lbl">Estoque atual</label><input id="fEst" inputmode="decimal" value="${p.estoque??''}" placeholder="0"></div><div><label class="lbl">Estoque mínimo</label><input id="fMin" inputmode="decimal" value="${p.minimo??''}" placeholder="0"></div></div>
  <p class="hint">Quando o estoque chegar no mínimo, o produto aparece na lista de compras. O custo serve para calcular o lucro.</p>
  <div class="mbtns">${id?`<button class="btn ghost danger" id="fDel">Excluir</button>`:''}<button class="btn primary" id="fSave">Salvar</button></div>`,()=>{
  $('#fSave').onclick=async()=>{const nome=$('#fNome').value.trim(),preco=pm($('#fPreco').value);if(!nome){toast('Informe o nome','warn');return}if(!preco){toast('Informe o preço de venda','warn');return}
    const data={nome,categoria:$('#fCat').value.trim()||'Outros',preco,custo:pm($('#fCusto').value),estoque:pn($('#fEst').value),minimo:pn($('#fMin').value),ativo:true};
    const pid=id||uid();try{await W(()=>q('produtos/'+pid,()=>S.set('produtos/'+pid,data)));closeModal();toast(id?'Produto atualizado':'Produto cadastrado');st.compras.vend=null}catch(e){}};
  if(id){let arm=false;$('#fDel').onclick=async()=>{if(!arm){arm=true;$('#fDel').textContent='Toque de novo p/ excluir';return}try{await W(()=>S.del('produtos/'+id));closeModal();toast('Produto excluído')}catch(e){}}}})}
function modalEntrada(id){const p=st.produtos.find(x=>x.id===id);if(!p)return;
  openModal(`<h3>Entrada de mercadoria</h3><p style="margin-bottom:4px"><b>${esc(p.nome)}</b></p><p class="mute" style="font-size:13px">Estoque atual: ${Number(p.estoque)||0}</p>
  <div class="g2"><div><label class="lbl">Quantidade que chegou</label><input id="nQ" inputmode="decimal" placeholder="0" autofocus></div><div><label class="lbl">Custo unitário</label><input id="nC" inputmode="decimal" value="${fmv(p.custo)}" placeholder="0,00"></div></div>
  <div class="mbtns"><button class="btn primary" id="nOk">Adicionar ao estoque</button></div>`,()=>{
  $('#nOk').onclick=async()=>{const qn=pn($('#nQ').value);if(!qn){toast('Informe a quantidade','warn');return}const upd={estoque:(Number(p.estoque)||0)+qn};const c=pm($('#nC').value);if(c)upd.custo=c;
    try{await W(()=>q('produtos/'+id,()=>S.update('produtos/'+id,upd)));closeModal();toast(`+${qn} ${p.nome}`);st.compras.vend=null}catch(e){}}})}
function modalEscolherComanda(pid){openModal(`<h3>Em qual comanda?</h3><div class="list">${st.comandas.map(c=>`<button class="prow" data-esc="${esc(c.id)}"><span class="pinfo"><b>#${esc(c.numero)}${c.nome?' · '+esc(c.nome):''}</b><span>${fm(subtotal(comItens(c)))} até agora</span></span>›</button>`).join('')||'<p class="mute">Nenhuma comanda aberta.</p>'}</div><div class="mbtns"><button class="btn primary" id="escNova">+ Abrir nova comanda</button></div>`,s=>{
  $('#escNova').onclick=()=>modalNovaComanda(pid?[(()=>{const p=st.produtos.find(x=>x.id===pid);return{pid,nome:p.nome,preco:p.preco,qtd:1}})()]:undefined);
  s.querySelectorAll('[data-esc]').forEach(b=>b.onclick=()=>{st.ticket.comandaId=b.dataset.esc;closeModal();if(pid)addProduto(pid);else render()})})}
function modalAjustes(){if(!isDono())return;
  openModal(`<h3>Ajustes</h3><label class="lbl">Nome da loja</label><input id="sNome" value="${esc(st.cfg.nome||'')}">
  <button class="btn" id="sEq" style="width:100%;margin-top:14px">👥 Equipe: cadastrar e remover garçons</button>
  <p class="hint">${st.mode==='nuvem'?'☁ Dados salvos na nuvem: aparecem em qualquer aparelho com acesso a este link.':'Modo demonstração: dados salvos só neste navegador.'}</p>
  <div class="mbtns"><button class="btn primary" id="sOk">Salvar</button></div>`,()=>{$('#sEq').onclick=()=>modalEquipe();$('#sOk').onclick=async()=>{st.cfg.nome=$('#sNome').value.trim()||NOME_PADRAO;try{await W(()=>S.set('config/loja',cfgPlain()));closeModal();render()}catch(e){}}})}

/* ============ eventos ============ */
const ACT={
  tab(id){st.tab=id;st.showTicket=false;if(id==='caixa')st.hist=null;if(id==='relatorios'&&st.rel.periodo!=='custom')loadRel();if(id==='estoque'&&st.estView==='compras')loadCompras();render();window.scrollTo(0,0)},
  cat(id,el){st.cat=el.dataset.v;render()},
  add(id){addProduto(id)},
  qmais(ix){const it=clone(ticketItens());if(!it[ix])return;it[ix].qtd++;setItens(it)},
  qmenos(ix){const it=clone(ticketItens());if(!it[ix])return;if(it[ix].qtd>1)it[ix].qtd--;else it.splice(ix,1);setItens(it)},
  limpar(){st.ticket.itens=[];render()},
  showTicket(){st.showTicket=true;render()},hideTicket(){st.showTicket=false;render()},
  async cobrar(){if(!isDono())return;const c=ticketComanda();if(c)await flushComanda(c.id);if(!ticketItens().length)return;if(!st.cfg.caixaAberto){modalAbrirCaixa(()=>modalPagar());return}modalPagar()},
  novaComanda(){modalNovaComanda()},
  login(id){modalPin(id)},
  sair(){if(st.sessao&&st.ticket.comandaId)flushComanda(st.ticket.comandaId);sair()},
  recarregarPublico(){carregarPublico()},
  pronto(){st.ticket.comandaId=null;st.showTicket=false;st.tab='comandas';render();window.scrollTo(0,0)},
  abrirComanda(id){st.ticket.comandaId=id;st.tab='vender';st.showTicket=true;render();window.scrollTo(0,0)},
  editComanda(id){modalEditComanda(id)},excluirComanda(id){excluirComanda(id)},enviarComanda(){modalEnviar()},
  abrirCaixa(){modalAbrirCaixa()},mov(id){modalMov(id)},fecharCaixa(){modalFechar()},
  cancelarVenda(id){const v=st.vendas.find(x=>x.id===id);if(!v)return;confirmar('Cancelar venda?',`Venda de ${fm(v.total)} às ${hm(v.ts)}. Os produtos voltam para o estoque e o valor sai do caixa.`,'Cancelar venda',async()=>{
    await W(()=>S.update(`caixas/${st.cfg.caixaAberto}/vendas/${id}`,{cancelada:true,canceladaEm:Date.now()}));await baixaEstoque(v.itens||[],+1);toast('Venda cancelada')})},
  novoProduto(){modalProduto()},editProduto(id){modalProduto(id)},entrada(id){modalEntrada(id)},
  estView(id,el){st.estView=el.dataset.v;if(st.estView==='compras')loadCompras();render()},
  estLow(id,el){st.estLow=el.dataset.v==='1';render()},
  async copiarCompras(){const rows=comprasRows();const txt=`Lista de compras · ${st.cfg.nome||NOME_PADRAO} · ${new Date().toLocaleDateString('pt-BR')}\n`+rows.map(r=>`- ${r.sug}x ${r.p.nome}`).join('\n');
    try{await navigator.clipboard.writeText(txt);toast('Lista copiada! Cole no WhatsApp do fornecedor.')}catch(e){openModal(`<h3>Lista de compras</h3><p class="hint" style="margin-bottom:8px">Selecione e copie:</p><textarea readonly>${esc(txt)}</textarea>`)}},
  periodo(id,el){st.rel.periodo=el.dataset.v;st.rel.dados=null;if(st.rel.periodo!=='custom')loadRel();render()},
  aplicarCustom(){loadRel()},
  expMensal(){const[y,m]=String(st.expMes).split('-').map(Number);if(!y||!m){toast('Escolha o mês','warn');return}
    gerarRelatorio('mensal',new Date(y,m-1,1).getTime(),new Date(y,m,1).getTime()-1,`Mensal – ${mesNome(y,m-1)}/${y}`,`Relatorio_Mensal_${y}-${String(m).padStart(2,'0')}_${slugLoja()}.xlsx`)},
  expAnual(){const y=parseInt(st.expAno,10);if(!y)return;gerarRelatorio('anual',new Date(y,0,1).getTime(),new Date(y+1,0,1).getTime()-1,`Anual – ${y}`,`Relatorio_Anual_${y}_${slugLoja()}.xlsx`)},
  expPeriodo(){const D=st.rel.dados;if(!D)return;const f=Math.min(D.f,Date.now());gerarRelatorio('periodo',D.i,D.f,'do período',`Relatorio_${dayKey(D.i)}_a_${dayKey(f)}_${slugLoja()}.xlsx`)},
  ajustes(){modalAjustes()},closeModal(){closeModal()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset.id,el,e)}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.bind;if(!k)return;const v=e.target.value;
  if(k==='relIni')st.rel.ini=v;else if(k==='relFim')st.rel.fim=v;else{st[k]=v;render()}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.change==='destino'){const v=e.target.value;
  if(v==='__nova'){render();modalNovaComanda()}else{st.ticket.comandaId=v||null;render()}}});
boot();
</script>
</body>
</html>
